plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.142'
    id 'com.gto.gtopublishgradleplugin' version '1.0.27'
}

version = gto_version
group = 'com.hollingsworth.ars_nouveau'
base {
    archivesName = 'ars_nouveau-1.20.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.withSourcesJar()

legacyForge {
    enable {
        forgeVersion = "${mc_version}-${forge_version}"
    }
    accessTransformers = [file('src/main/resources/META-INF/accesstransformer.cfg')]

    parchment {
        minecraftVersion = mc_version
        mappingsVersion = parchment_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
        }
        data {
            data()
            programArguments.addAll '--mod', 'ars_nouveau', '--all'
            programArguments.addAll '--output', file('src/generated/resources/').getAbsolutePath()
            programArguments.addAll '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            gameDirectory = file('run')
            systemProperty('forge.logging.console.level', 'debug')
            systemProperty('fml.earlyprogresswindow', 'false')
            programArguments.addAll '-mixin.config=ars_nouveau.mixins.json'
        }
    }

    mods {
        ars_nouveau {
            sourceSet sourceSets.main
        }
    }
}

mixin {
    add sourceSets.main, "ars_nouveau.refmap.json"
    config "ars_nouveau.mixins.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = 'GTOdyssey'
        url = 'https://gtodyssey.com/maven/releases'
        content {
            includeGroup 'com.gto'
            includeGroup 'appeng'
        }
    }
    maven { url = "https://maven.theillusivec4.top/" }
    maven {
        name = "ModMaven"
        url = "https://modmaven.k-4u.nl"
    }
    maven { url "https://maven.blamejared.com" }
    maven {
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven { url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    maven {
        name = 'Sponge / Mixin'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    compileOnly 'org.jetbrains:annotations:23.0.0'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    compileOnly(annotationProcessor("com.github.llamalad7.mixinextras:mixinextras-common:${mixin_extras_version}"))
    implementation(jarJar("com.github.llamalad7.mixinextras:mixinextras-forge:${mixin_extras_version}"))

    modImplementation("com.gto:datasynclib-forge-1.20.1:${datasynclib_version}")
    modImplementation("com.gto:gtoutils-forge-1.20.1:${gtoutils_version}")
    modImplementation("com.gto:gtorenders-forge-1.20.1:${gtorenders_version}")
    modCompileOnly("appeng:appliedenergistics2-forge-1.20.1:${ae2_version}") { transitive = false }
    modImplementation("software.bernie.geckolib:geckolib-forge-${mc_version}:${gecko_version}")
    modImplementation("vazkii.patchouli:Patchouli:${patchouli_version}")

    modCompileOnly("mezz.jei:jei-${mc_version}-common-api:${jei_version}")
    modCompileOnly("mezz.jei:jei-${mc_version}-forge-api:${jei_version}")
    modRuntimeOnly("mezz.jei:jei-${mc_version}-common:${jei_version}")
    modRuntimeOnly("mezz.jei:jei-${mc_version}-forge:${jei_version}")

    modImplementation("curse.maven:curios-309927:4583413")
    modImplementation("curse.maven:terrablender-563928:4590487")
    modImplementation("curse.maven:jade-324717:4573193")
    modImplementation("curse.maven:caelus-308989:4581481")
    modImplementation("curse.maven:placebo-283644:4691637")
    modImplementation("curse.maven:aphoattr-898963:4688147")
    modImplementation("curse.maven:functional-storage-556861:4878053")
    modImplementation("curse.maven:titanium-287342:4943665")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs.addAll(["-Xmaxerrs", "100000"])
}

tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "ArsNouveau",
                "Specification-Vendor"    : "baileyh",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : "${version}",
                "Implementation-Vendor"   : "baileyh",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"            : "ars_nouveau.mixins.json"
        ])
    }
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId base.archivesName.get()
            version project.version
            artifact reobfJar
            artifact sourcesJar
            pom.withXml {
                def node = asNode()
                if (node.dependencies.size() > 0)
                    node.remove(node.dependencies)
            }
        }
    }
    repositories {
        maven {
            name = 'gtodysseyRepository'
            url = 'https://gtodyssey.com/maven/releases'
            credentials {
                username = findProperty('gtodysseyRepositoryUsername') ?: ''
                password = findProperty('gtodysseyRepositoryPassword') ?: ''
            }
        }
    }
}

gtoPublish {
    publishMaven      = true
    publishGithub     = false
    publishCurseforge = true
    mavenRepoName     = 'gtodysseyRepository'
    mavenRepoUrl      = 'releases'
    minecraftVersion  = '1.20.1'
    modLoader         = 'Forge'
    curseforgeProjectId   = '1755416'
    curseforgeJavaVersion = 'Java 21'
    curseforgeEnvironment = 'both'
    curseforgeRelations   = [geckolib: 'required', curios: 'required', 'data-sync-lib': 'required']
}
